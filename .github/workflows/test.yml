name: Test
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-26.04
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          # the ubuntu-26.04 test job would otherwise get the same cache key,
          # and whichever saves second warns "Unable to reserve cache"
          cache-suffix: lint

      - name: Install dev tools
        run: uv sync --locked

      # the same hooks contributors run, with versions from uv.lock
      - name: Run pre-commit hooks
        env:
          SKIP: pytest # the test matrix runs it on every platform
        run: uv run --frozen pre-commit run --all-files --show-diff-on-failure

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0

      # use the runner's own python, as the action does, so the Windows job
      # tests the 3.12 minimum
      - name: Unit tests
        run: |
          uv run --frozen --python-preference only-system python --version
          uv run --frozen --python-preference only-system pytest

      - name: Compile fixtures
        id: ok
        uses: ./
        with:
          files: test/fixtures/ok/**/*.lua

      - name: Check compiled fixtures
        env:
          FILES: ${{ steps.ok.outputs.files }}
          LUAC: ${{ steps.ok.outputs.luac }}
        run: |
          # no mapfile: macOS runners have bash 3.2
          files=()
          while IFS= read -r f; do files+=("$f"); done <<< "$FILES"
          if [ ${#files[@]} -ne 3 ]; then
            echo "::error::Expected 3 compiled files, got ${#files[@]}: $FILES"
            exit 1
          fi
          python scripts/check_header.py "${files[@]}"
          # load each one back through lundump
          for f in "${files[@]}"; do
            "$LUAC" -l -p "$f" > /dev/null
          done
          [ ! -e test/fixtures/ok/notes.luac ]

      - name: Check glob matching
        env:
          LUAC: ${{ steps.ok.outputs.luac }}
        run: |
          # a single '*' stays within its directory
          out=$(LUAC="$LUAC" FILES='test/fixtures/ok/*.lua' CHECK_ONLY=true python scripts/compile.py)
          grep -qF 'checked 1 of 1 scripts' <<< "$out"
          # '**' reaches every depth, including directories with spaces
          out=$(LUAC="$LUAC" FILES='test/**/ok/**/*.lua' CHECK_ONLY=true python scripts/compile.py)
          grep -qF 'checked 3 of 3 scripts' <<< "$out"

      - name: Compile into an output directory
        id: dist
        uses: ./
        with:
          files: test/fixtures/ok/main.lua
          output-dir: dist

      - name: Check output directory
        env:
          FILES: ${{ steps.dist.outputs.files }}
        run: |
          [ "$FILES" = dist/test/fixtures/ok/main.luac ]
          python scripts/check_header.py dist/test/fixtures/ok/main.luac

      # The unit tests cover failure handling with a faked compiler. This checks
      # the real compiler's error format still parses. The output is captured
      # rather than printed, so the expected error doesn't show up as a failure
      # annotation on the run.
      - name: Check the real compiler's syntax errors are annotated
        env:
          LUAC: ${{ steps.ok.outputs.luac }}
        run: |
          if out=$(LUAC="$LUAC" FILES='test/fixtures/bad/*.lua' CHECK_ONLY=true python scripts/compile.py 2>&1); then
            echo "::error::Expected compile.py to fail on bad/broken.lua"
            exit 1
          fi
          grep -qF "::error file=test/fixtures/bad/broken.lua,line=3::unexpected symbol near 'end'" <<< "$out" || {
            echo "::error::Missing or changed annotation for bad/broken.lua"
            exit 1
          }
          [ ! -e test/fixtures/bad/broken.luac ]
