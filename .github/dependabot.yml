version: 2
updates:
  # dev tools in pyproject.toml / uv.lock (ruff, pre-commit, ...)
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tools:
        patterns: ["*"]

  # actions used by the workflows and by action.yml
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
