[project]
name = "edgetx-luac-action"
version = "0.0.0"
description = "GitHub Action that precompiles Lua scripts to EdgeTX bytecode"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "actionlint-py",
    "commitizen",
    "editorconfig-checker",
    "pre-commit",
    "ruff",
    "shellcheck-py",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
